name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo install --fix
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Print SHA-1 (for Google login)
        run: keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | grep SHA1
      - uses: actions/upload-artifact@v4
        with:
          name: sastabazar-${{ matrix.app }}-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
