name: Build APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project (unzips if needed)
        run: |
          for z in *.zip; do [ -e "$z" ] && unzip -oq "$z" -d _x; done
          ROOT=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "Project at: $ROOT"
          echo "ROOT=$ROOT" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build both APKs
        working-directory: ${{ env.ROOT }}
        run: gradle :user:assembleRelease :admin:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SastaBazar-User-APK
          path: ${{ env.ROOT }}/user/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SastaBazar-Admin-APK
          path: ${{ env.ROOT }}/admin/build/outputs/apk/release/*.apk
