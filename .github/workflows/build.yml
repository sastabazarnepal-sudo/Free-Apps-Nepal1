name: Build APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Firebase configuration
        run: |
          if [ ! -f "app-user/google-services.json" ]; then
            echo "::error::app-user/google-services.json is missing"
            exit 1
          fi

          if [ ! -f "app-admin/google-services.json" ]; then
            echo "::error::app-admin/google-services.json is missing"
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Core Unit Tests
        run: |
          ./gradlew :core:testDebugUnitTest --console=plain

      - name: Build User APK
        run: |
          ./gradlew :app-user:assembleDebug --console=plain

      - name: Build Admin APK
        run: |
          ./gradlew :app-admin:assembleDebug --console=plain

      - name: Verify APK files
        run: |
          test -f app-user/build/outputs/apk/debug/app-user-debug.apk
          test -f app-admin/build/outputs/apk/debug/app-admin-debug.apk

          echo "User APK:"
          ls -lh app-user/build/outputs/apk/debug/app-user-debug.apk

          echo "Admin APK:"
          ls -lh app-admin/build/outputs/apk/debug/app-admin-debug.apk

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeAppsNepal-User
          path: app-user/build/outputs/apk/debug/app-user-debug.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeAppsNepal-Admin
          path: app-admin/build/outputs/apk/debug/app-admin-debug.apk
          if-no-files-found: error
